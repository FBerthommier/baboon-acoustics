# Deploys the whole repository to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The demos (demos/index.html), the supplement
# (supplementary/Supplementary_materials.pdf) and the user documentation
# (docs/baboon-acoustics-documentation.pdf) then become directly readable
# at https://<account>.github.io/baboon-acoustics/...
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
